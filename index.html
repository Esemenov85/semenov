<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ФинПомощник — загрузка…</title>
    <style>
        :root {
            --main:      #0B3C49;
            --bg:        #CBD2D0;
            --text:      #6A8D92;
            --accent-y:  #F0E100;
            --accent-p:  #731963;
        }
        [data-theme="dark"] {
            --main:      #F0E100;
            --bg:        #0a181d;
            --text:      #8FAEB4;
            --accent-y:  #F0E100;
            --accent-p:  #C43FAF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .loader__logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--main);
            letter-spacing: -0.02em;
        }
        [data-theme="dark"] .loader__logo { color: var(--accent-y); }

        .loader__mark {
            width: 48px;
            height: 48px;
            background: var(--accent-y);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0B3C49;
            font-size: 1.4rem;
            font-weight: 800;
            box-shadow: 0 8px 20px rgba(240, 225, 0, 0.35);
        }

        .loader__spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(106, 141, 146, 0.25);
            border-top-color: var(--accent-y);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .loader__text {
            font-size: 0.85rem;
            color: var(--text);
            font-weight: 600;
            letter-spacing: 0.02em;
        }
    </style>
</head>
<body>

    <div class="loader">
        <div class="loader__logo">
            <span class="loader__mark">₽</span>
            <span>ФинПомощник</span>
        </div>
        <div class="loader__spinner"></div>
        <div class="loader__text">Загружаем…</div>
    </div>

    <script>
        (function () {
            const THEME_KEY = 'finassist-theme';

            // Применяем сохранённую тему сразу, чтобы не было «вспышки» белого
            try {
                const saved = localStorage.getItem(THEME_KEY);
                if (saved === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                } else if (saved === 'light') {
                    document.documentElement.removeAttribute('data-theme');
                } else {
                    if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                        document.documentElement.setAttribute('data-theme', 'dark');
                    }
                }
            } catch (e) {}

            // Роутер больше НЕ проверяет авторизацию — это делает login.html.
            // Он просто отправляет пользователя на страницу входа,
            // а login.html сам решит: показать форму или сразу в app.html.
            setTimeout(function () {
                window.location.replace('login.html');
            }, 250);
        })();
    </script>
</body>
</html>
